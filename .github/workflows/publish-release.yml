name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.5.1"
        required: true
        default: "0.5.1"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve version
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}".TrimStart("v")
            $tag = "v$version"
          } else {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart("v")
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m venv .venv-win
          .\.venv-win\Scripts\python.exe -m pip install --upgrade pip
          .\.venv-win\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv-win\Scripts\python.exe -m pip install pyinstaller==6.11.1

      - name: Validate Python sources
        shell: powershell
        run: |
          .\.venv-win\Scripts\python.exe -m compileall voxgo tests main.py
          .\.venv-win\Scripts\python.exe -m unittest discover -s tests -v

      - name: Collect CUDA runtime
        shell: powershell
        run: |
          .\scripts\collect_cuda_runtime.ps1 -InstallNvidiaPipPackages

      - name: Build portable packages
        shell: powershell
        run: |
          .\scripts\build_portable.ps1 -Version "$env:APP_VERSION"

      - name: Write release notes
        shell: pwsh
        run: |
          $lite = "release\VoxGo-v$env:APP_VERSION-lite.zip"
          $full = "release\VoxGo-v$env:APP_VERSION-full.zip"
          $fullCuda = "release\VoxGo-v$env:APP_VERSION-full-cuda.zip"
          $cudaRuntime = "release\VoxGo-v$env:APP_VERSION-cuda-runtime.zip"
          $liteHash = (Get-FileHash $lite -Algorithm SHA256).Hash.ToLowerInvariant()
          $fullHash = (Get-FileHash $full -Algorithm SHA256).Hash.ToLowerInvariant()
          $fullCudaHash = (Get-FileHash $fullCuda -Algorithm SHA256).Hash.ToLowerInvariant()
          $cudaRuntimeHash = (Get-FileHash $cudaRuntime -Algorithm SHA256).Hash.ToLowerInvariant()
          $liteSize = [math]::Round((Get-Item $lite).Length / 1MB, 1)
          $fullSize = [math]::Round((Get-Item $full).Length / 1MB, 1)
          $fullCudaSize = [math]::Round((Get-Item $fullCuda).Length / 1MB, 1)
          $cudaRuntimeSize = [math]::Round((Get-Item $cudaRuntime).Length / 1MB, 1)
          @"
          ## VoxGo $env:APP_VERSION

          ### 更新内容

          - 音频设备异常后自动恢复：重新检测 USB、蓝牙和 HDMI 输出，优先恢复原设备，必要时回退系统默认输出，并显示恢复状态。
          - 浮窗位置自动恢复：屏幕配置变化后自动找回不可见浮窗，托盘新增重置浮窗位置。
          - 浮窗显示当前翻译方式：API、Google 或本地，切换后立即更新。
          - 字幕支持悬停复制：鼠标移入正常字幕后可一键复制译文。
          - 首次启动跟随系统语言：zh_CN、zh_TW 使用中文，其他语言使用英文；已有用户设置保持不变。
          - 更新使用统计：基础统计始终启用，用于每日活跃安装数，使用不跨日关联的每日标识；详细使用与稳定性统计可在设置中关闭，均不包含语音、识别或翻译内容。升级时保留统计状态。

          ### What's new

          - Automatic audio recovery: detect USB, Bluetooth, and HDMI output changes, reconnect the original device or fall back to the system default, and show recovery status.
          - Overlay position recovery: bring an invisible overlay back after display changes, with a new Reset Overlay Position tray action.
          - The overlay now shows the current translation provider: API, Google, or Local, updating immediately after a switch.
          - Hover over a completed subtitle to copy its translation with one click.
          - First launch follows the system language: Chinese for zh_CN and zh_TW, English for all other locales. Existing language preferences are preserved.
          - Updated usage statistics: Basic is always enabled and measures daily active installations using daily identifiers that are not linked across days. Optional detailed usage and stability statistics can be disabled in Settings; neither includes audio, recognition, or translation content. Updates preserve statistics state.

          ### Downloads

          - ``VoxGo-v$env:APP_VERSION-lite.zip``: $liteSize MB
            - SHA256: ``$liteHash``
          - ``VoxGo-v$env:APP_VERSION-full.zip``: $fullSize MB
            - SHA256: ``$fullHash``
          - ``VoxGo-v$env:APP_VERSION-full-cuda.zip``: $fullCudaSize MB
            - SHA256: ``$fullCudaHash``
          - ``VoxGo-v$env:APP_VERSION-cuda-runtime.zip``: $cudaRuntimeSize MB
            - SHA256: ``$cudaRuntimeHash``
          "@ | Set-Content -Encoding UTF8 release-notes.md

          "LITE_SHA256=$liteHash" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FULL_SHA256=$fullHash" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FULL_CUDA_SHA256=$fullCudaHash" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CUDA_RUNTIME_SHA256=$cudaRuntimeHash" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: VoxGo ${{ env.APP_VERSION }}
          body_path: release-notes.md
          files: |
            release/VoxGo-v${{ env.APP_VERSION }}-lite.zip
            release/VoxGo-v${{ env.APP_VERSION }}-full.zip
            release/VoxGo-v${{ env.APP_VERSION }}-full-cuda.zip
            release/VoxGo-v${{ env.APP_VERSION }}-cuda-runtime.zip
          fail_on_unmatched_files: true
          make_latest: true
          overwrite_files: true

      - name: Sync GitCode Lite mirror
        shell: pwsh
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          if (-not $env:GITCODE_TOKEN) {
            Write-Warning "GITCODE_TOKEN is not configured; China mirror synchronization requires a follow-up."
            exit 0
          }
          # This repository hosts release downloads, not a second client source tree.
          $mirrorHead = git ls-remote https://gitcode.com/zxbb1190/VoxGo.git HEAD
          if ($LASTEXITCODE -ne 0 -or -not $mirrorHead) { throw "Cannot resolve GitCode mirror HEAD" }
          $mirrorCommit = ($mirrorHead -split '\s+')[0]
          .\.venv-win\Scripts\python.exe scripts/publish_gitcode_release.py --tag "$env:TAG_NAME" --zip "release/VoxGo-v$env:APP_VERSION-lite.zip" --notes-file release-notes.md --sha256 "$env:LITE_SHA256" --target-commitish "$mirrorCommit"
          if ($LASTEXITCODE -ne 0) { throw "GitCode mirror synchronization failed" }
          "GITCODE_MIRROR_VERIFIED=true" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Update website release manifest
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          git checkout -B main origin/main

          $manifestPath = "docs\update.json"
          $manifest = Get-Content $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $manifest.latest = $env:APP_VERSION
          $manifest.channel = "stable"
          $manifest.title = "VoxGo v$env:APP_VERSION"
          $notesEn = @(
            "Automatic audio recovery: detect USB, Bluetooth, and HDMI output changes, reconnect the original device or fall back to the system default, and show recovery status.",
            "Overlay position recovery: bring an invisible overlay back after display changes, with a new Reset Overlay Position tray action.",
            "The overlay now shows the current translation provider: API, Google, or Local, updating immediately after a switch.",
            "Hover over a completed subtitle to copy its translation with one click.",
            "First launch follows the system language: Chinese for zh_CN and zh_TW, English for all other locales. Existing language preferences are preserved.",
            "Updated usage statistics: Basic is always enabled and measures daily active installations using daily identifiers that are not linked across days. Optional detailed usage and stability statistics can be disabled in Settings; neither includes audio, recognition, or translation content. Updates preserve statistics state."
          )
          $notesZh = @(
            "音频设备异常后自动恢复：重新检测 USB、蓝牙和 HDMI 输出，优先恢复原设备，必要时回退系统默认输出，并显示恢复状态。",
            "浮窗位置自动恢复：屏幕配置变化后自动找回不可见浮窗，托盘新增重置浮窗位置。",
            "浮窗显示当前翻译方式：API、Google 或本地，切换后立即更新。",
            "字幕支持悬停复制：鼠标移入正常字幕后可一键复制译文。",
            "首次启动跟随系统语言：zh_CN、zh_TW 使用中文，其他语言使用英文；已有用户设置保持不变。",
            "更新使用统计：基础统计始终启用，用于每日活跃安装数，使用不跨日关联的每日标识；详细使用与稳定性统计可在设置中关闭，均不包含语音、识别或翻译内容。升级时保留统计状态。"
          )
          $manifest.notes = $notesEn
          $manifest | Add-Member -NotePropertyName notes_en -NotePropertyValue $notesEn -Force
          $manifest | Add-Member -NotePropertyName notes_zh -NotePropertyValue $notesZh -Force
          $manifest.release_url = "https://github.com/${{ github.repository }}/releases/tag/$env:TAG_NAME"
          $manifest.download_lite_url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG_NAME/VoxGo-v$env:APP_VERSION-lite.zip"
          $manifest.download_full_url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG_NAME/VoxGo-v$env:APP_VERSION-full.zip"
          $manifest.download_full_cuda_url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG_NAME/VoxGo-v$env:APP_VERSION-full-cuda.zip"
          $manifest.cuda_runtime_url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG_NAME/VoxGo-v$env:APP_VERSION-cuda-runtime.zip"
          $manifest.sha256_lite = $env:LITE_SHA256
          $manifest.sha256_full = $env:FULL_SHA256
          $manifest.sha256_full_cuda = $env:FULL_CUDA_SHA256
          $manifest.sha256_cuda_runtime = $env:CUDA_RUNTIME_SHA256
          $manifest.mandatory = $false
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 $manifestPath

          # Advance the China mirror only when the matching ZIP is available.
          $mirrorUrl = "https://gitcode.com/zxbb1190/VoxGo/releases/download/$env:TAG_NAME/VoxGo-v$env:APP_VERSION-lite.zip"
          $mirrorReady = $env:GITCODE_MIRROR_VERIFIED -eq 'true'
          if (-not $mirrorReady) { Write-Warning "China mirror not verified; retaining its previous version." }
          # Protect old mirror links from the general website version replacement.
          foreach ($pagePath in @("docs/index.html", "docs/en/index.html")) {
            $page = Get-Content $pagePath -Raw -Encoding UTF8
            $mirrorMatches = [regex]::Matches($page, 'https://gitcode\.com/[^"<> ]+').Value | Select-Object -Unique
            foreach ($oldMirror in $mirrorMatches) { $page = $page.Replace($oldMirror, '__VOXGO_CHINA_MIRROR__') }
            $page = $page -replace 'VoxGo-v\d+\.\d+\.\d+', "VoxGo-v$env:APP_VERSION"
            $page = $page -replace 'releases/download/v\d+\.\d+\.\d+', "releases/download/$env:TAG_NAME"
            $page = $page -replace 'VoxGo v\d+\.\d+\.\d+', "VoxGo v$env:APP_VERSION"
            if ($mirrorReady) {
              $page = $page.Replace('__VOXGO_CHINA_MIRROR__', $mirrorUrl)
              $mirrorVersion = $env:APP_VERSION
            } elseif ($mirrorMatches) {
              $page = $page.Replace('__VOXGO_CHINA_MIRROR__', [string]@($mirrorMatches)[0])
              $mirrorVersion = [regex]::Match([string]@($mirrorMatches)[0], '/download/v(\d+\.\d+\.\d+)/').Groups[1].Value
            }
            $page = $page -replace '国内镜像下载（Lite[^）]*）', "国内镜像下载（Lite v$mirrorVersion）"
            $page = $page -replace 'China mirror \(Lite[^)]*\)', "China mirror (Lite v$mirrorVersion)"
            [System.IO.File]::WriteAllText((Join-Path $pwd $pagePath), $page, (New-Object System.Text.UTF8Encoding($false)))
          }
          git add $manifestPath docs/index.html docs/en/index.html
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release manifest already up to date."
          } else {
            git commit -m "Update release manifest for $env:TAG_NAME"
            git push origin HEAD:main
          }
