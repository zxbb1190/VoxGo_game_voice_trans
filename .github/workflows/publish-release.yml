name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.6.0"
        required: true
        default: "0.6.0"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # RC compatibility tests load the actual published client baseline.
          fetch-depth: 0

      - name: Resolve version
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}".TrimStart("v")
            $tag = "v$version"
          } else {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart("v")
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m venv .venv-win
          .\.venv-win\Scripts\python.exe -m pip install --upgrade pip
          .\.venv-win\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv-win\Scripts\python.exe -m pip install -r requirements-test.txt
          .\.venv-win\Scripts\python.exe -m pip install pyinstaller==6.11.1

      - name: Validate Python sources
        shell: powershell
        run: |
          .\.venv-win\Scripts\python.exe -m compileall voxgo tests main.py
          .\.venv-win\Scripts\python.exe -m unittest discover -s tests -v

      - name: Collect CUDA runtime
        shell: powershell
        run: |
          .\scripts\collect_cuda_runtime.ps1 -InstallNvidiaPipPackages

      - name: Build portable packages
        shell: powershell
        run: |
          .\scripts\build_portable.ps1 -Version "$env:APP_VERSION"

      - name: Write release notes
        shell: pwsh
        run: |
          .\.venv-win\Scripts\python.exe scripts/release_metadata.py notes --version "$env:APP_VERSION" --packages release --output release-notes.md --github-env "$env:GITHUB_ENV"
          if ($LASTEXITCODE -ne 0) { throw "Release notes or artifact hashing failed" }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: VoxGo ${{ env.APP_VERSION }}
          body_path: release-notes.md
          files: |
            release/VoxGo-v${{ env.APP_VERSION }}-lite.zip
            release/VoxGo-v${{ env.APP_VERSION }}-full.zip
            release/VoxGo-v${{ env.APP_VERSION }}-full-cuda.zip
            release/VoxGo-v${{ env.APP_VERSION }}-cuda-runtime.zip
          fail_on_unmatched_files: true
          make_latest: true
          overwrite_files: true

      - name: Sync GitCode Lite mirror
        # A mirror outage must not block the already-published GitHub update.
        continue-on-error: true
        shell: pwsh
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          if (-not $env:GITCODE_TOKEN) {
            Write-Warning "GITCODE_TOKEN is not configured; China mirror synchronization requires a follow-up."
            exit 0
          }
          # This repository hosts release downloads, not a second client source tree.
          $mirrorHead = git ls-remote https://gitcode.com/zxbb1190/VoxGo.git HEAD
          if ($LASTEXITCODE -ne 0 -or -not $mirrorHead) { throw "Cannot resolve GitCode mirror HEAD" }
          $mirrorCommit = ($mirrorHead -split '\s+')[0]
          .\.venv-win\Scripts\python.exe scripts/publish_gitcode_release.py --tag "$env:TAG_NAME" --zip "release/VoxGo-v$env:APP_VERSION-lite.zip" --notes-file release-notes.md --sha256 "$env:LITE_SHA256" --target-commitish "$mirrorCommit"
          if ($LASTEXITCODE -ne 0) { throw "GitCode mirror synchronization failed" }
          "GITCODE_MIRROR_VERIFIED=true" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Update website release manifest
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          git checkout -B main origin/main

          $manifestPath = "docs\update.json"
          $syncArgs = @("site", "--version", $env:APP_VERSION)
          if ($env:GITCODE_MIRROR_VERIFIED -eq 'true') { $syncArgs += "--mirror-verified" }
          .\.venv-win\Scripts\python.exe scripts/release_metadata.py @syncArgs
          if ($LASTEXITCODE -ne 0) { throw "Published release metadata validation failed" }
          # Render only the new release and previously generated bilingual history.
          $historyTags = @(Get-ChildItem docs/changelog -Directory | Where-Object { $_.Name -match '^v\d+\.\d+\.\d+$' } | ForEach-Object { $_.Name })
          $releaseTags = @(@($env:TAG_NAME) + $historyTags | Select-Object -Unique)
          python scripts/build_website_changelog.py --tags @releaseTags
          if ($LASTEXITCODE -ne 0) { throw "Published changelog generation failed" }
          # Generate JA/KO/RU from the updated EN page, preserving mirror version
          # labels and requiring complete translations before publishing the site.
          $websiteDate = Get-Date -Format "yyyy-MM-dd"
          python scripts/build_localized_website.py --write --lastmod $websiteDate
          if ($LASTEXITCODE -ne 0) { throw "Localized website generation failed" }
          python scripts/build_localized_website.py --check
          if ($LASTEXITCODE -ne 0) { throw "Localized website verification failed" }
          git add $manifestPath docs/index.html docs/en/index.html docs/ja/index.html docs/ko/index.html docs/ru/index.html docs/sitemap.xml docs/changelog README.md README_EN.md docs/releases
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release manifest already up to date."
          } else {
            git commit -m "Update release manifest for $env:TAG_NAME"
            git push origin HEAD:main
          }
