name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.4.2"
        required: true
        default: "0.4.2"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve version
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}".TrimStart("v")
            $tag = "v$version"
          } else {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart("v")
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m venv .venv-win
          .\.venv-win\Scripts\python.exe -m pip install --upgrade pip
          .\.venv-win\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv-win\Scripts\python.exe -m pip install pyinstaller==6.11.1

      - name: Validate Python sources
        shell: powershell
        run: |
          .\.venv-win\Scripts\python.exe -m compileall voxgo tests main.py
          .\.venv-win\Scripts\python.exe -m unittest discover -s tests -v

      - name: Collect CUDA runtime
        shell: powershell
        run: |
          .\scripts\collect_cuda_runtime.ps1 -InstallNvidiaPipPackages

      - name: Build portable packages
        shell: powershell
        run: |
          .\scripts\build_portable.ps1 -Version "$env:APP_VERSION"

      - name: Write release notes
        shell: powershell
        run: |
          $lite = "release\VoxGo-v$env:APP_VERSION-lite.zip"
          $full = "release\VoxGo-v$env:APP_VERSION-full.zip"
          $fullCuda = "release\VoxGo-v$env:APP_VERSION-full-cuda.zip"
          $cudaRuntime = "release\VoxGo-v$env:APP_VERSION-cuda-runtime.zip"
          $liteHash = (Get-FileHash $lite -Algorithm SHA256).Hash.ToLowerInvariant()
          $fullHash = (Get-FileHash $full -Algorithm SHA256).Hash.ToLowerInvariant()
          $fullCudaHash = (Get-FileHash $fullCuda -Algorithm SHA256).Hash.ToLowerInvariant()
          $cudaRuntimeHash = (Get-FileHash $cudaRuntime -Algorithm SHA256).Hash.ToLowerInvariant()
          $liteSize = [math]::Round((Get-Item $lite).Length / 1MB, 1)
          $fullSize = [math]::Round((Get-Item $full).Length / 1MB, 1)
          $fullCudaSize = [math]::Round((Get-Item $fullCuda).Length / 1MB, 1)
          $cudaRuntimeSize = [math]::Round((Get-Item $cudaRuntime).Length / 1MB, 1)
          @"
          ## VoxGo $env:APP_VERSION

          - Added in-app update downloads with SHA256 verification, install-and-restart, configuration/model preservation, and rollback on failure. Users upgrading from 0.4.1 must download manually once.
          - Added local offline Chinese/English translation with OPUS-MT models; download models once before offline use.
          - Fixed the Simplified Chinese target language token and added contextual game terminology rules. Translation quality remains limited for complex game dialogue.
          - Added resilient model download sources and bilingual update notes.

          ### Downloads

          - ``VoxGo-v$env:APP_VERSION-lite.zip``: $liteSize MB
            - SHA256: ``$liteHash``
          - ``VoxGo-v$env:APP_VERSION-full.zip``: $fullSize MB
            - SHA256: ``$fullHash``
          - ``VoxGo-v$env:APP_VERSION-full-cuda.zip``: $fullCudaSize MB
            - SHA256: ``$fullCudaHash``
          - ``VoxGo-v$env:APP_VERSION-cuda-runtime.zip``: $cudaRuntimeSize MB
            - SHA256: ``$cudaRuntimeHash``
          "@ | Set-Content -Encoding UTF8 release-notes.md

          "LITE_SHA256=$liteHash" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FULL_SHA256=$fullHash" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FULL_CUDA_SHA256=$fullCudaHash" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CUDA_RUNTIME_SHA256=$cudaRuntimeHash" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: VoxGo ${{ env.APP_VERSION }}
          body_path: release-notes.md
          files: |
            release/VoxGo-v${{ env.APP_VERSION }}-lite.zip
            release/VoxGo-v${{ env.APP_VERSION }}-full.zip
            release/VoxGo-v${{ env.APP_VERSION }}-full-cuda.zip
            release/VoxGo-v${{ env.APP_VERSION }}-cuda-runtime.zip
          fail_on_unmatched_files: true
          make_latest: true
          overwrite_files: true

      - name: Update website release manifest
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          git checkout -B main origin/main

          $manifestPath = "docs\update.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.latest = $env:APP_VERSION
          $manifest.channel = "stable"
          $manifest.title = "VoxGo v$env:APP_VERSION"
          $manifest.notes = @(
            "Added in-app update downloads with SHA256 verification, install-and-restart, configuration/model preservation, and rollback on failure. Users upgrading from 0.4.1 must download manually once.",
            "Added local offline Chinese/English translation with OPUS-MT models; download models once before offline use.",
            "Fixed the Simplified Chinese target language token and added contextual game terminology rules. Translation quality remains limited for complex game dialogue.",
            "Added resilient model download sources and bilingual update notes."
          )
          $manifest | Add-Member -NotePropertyName notes_en -NotePropertyValue $manifest.notes -Force
          $manifest | Add-Member -NotePropertyName notes_zh -NotePropertyValue @("新增应用内更新下载、SHA256 校验和安装重启，保留配置与模型，失败时回滚；0.4.1 用户首次升级仍需手动下载。", "新增 OPUS-MT 中英双向本地离线翻译，首次下载模型后可断网使用。", "修正简体中文目标语言标记，新增带语境判断的游戏术语规则；复杂游戏对话的翻译质量仍有限。", "增强模型下载源容错，更新提示支持双语发布说明。") -Force
          $manifest.release_url = "https://github.com/${{ github.repository }}/releases/tag/$env:TAG_NAME"
          $manifest.download_lite_url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG_NAME/VoxGo-v$env:APP_VERSION-lite.zip"
          $manifest.download_full_url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG_NAME/VoxGo-v$env:APP_VERSION-full.zip"
          $manifest.download_full_cuda_url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG_NAME/VoxGo-v$env:APP_VERSION-full-cuda.zip"
          $manifest.cuda_runtime_url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG_NAME/VoxGo-v$env:APP_VERSION-cuda-runtime.zip"
          $manifest.sha256_lite = $env:LITE_SHA256
          $manifest.sha256_full = $env:FULL_SHA256
          $manifest.sha256_full_cuda = $env:FULL_CUDA_SHA256
          $manifest.sha256_cuda_runtime = $env:CUDA_RUNTIME_SHA256
          $manifest.mandatory = $false
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 $manifestPath

          foreach ($pagePath in @("docs/index.html", "docs/en/index.html")) {
            $page = Get-Content $pagePath -Raw -Encoding UTF8
            $page = $page -replace 'VoxGo-v\d+\.\d+\.\d+', "VoxGo-v$env:APP_VERSION"
            $page = $page -replace 'releases/download/v\d+\.\d+\.\d+', "releases/download/$env:TAG_NAME"
            $page = $page -replace 'VoxGo v\d+\.\d+\.\d+', "VoxGo v$env:APP_VERSION"
            [System.IO.File]::WriteAllText((Join-Path $pwd $pagePath), $page, (New-Object System.Text.UTF8Encoding($false)))
          }
          git add $manifestPath docs/index.html docs/en/index.html
          if (git diff --cached --quiet) {
            Write-Host "Release manifest already up to date."
          } else {
            git commit -m "Update release manifest for $env:TAG_NAME"
            git push origin HEAD:main
          }
