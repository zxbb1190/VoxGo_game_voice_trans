name: Code Quality

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt -r requirements-test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Syntax and unused-code checks
        shell: pwsh
        run: |
          python -m compileall -q voxgo tests scripts diagnostics hooks main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check voxgo main.py tests scripts diagnostics hooks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/index_test_evidence.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # voxgo-api is private. A read-only credential may be configured for
      # trusted default-branch runs; never expose it to pull-request code.
      - name: Checkout optional local Worker contract source
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request' && vars.VOXGO_API_CONTRACTS == 'true'
        uses: actions/checkout@v4
        with:
          repository: zxbb1190/voxgo-api
          ref: ${{ vars.VOXGO_API_REF || 'main' }}
          token: ${{ secrets.VOXGO_API_READ_TOKEN }}
          path: .contract-api
          persist-credentials: false
      - name: Select contract tests
        shell: pwsh
        run: |
          if (Test-Path .contract-api/src/index.js) {
            "VOXGO_API_ROOT=$((Resolve-Path .contract-api).Path)" >> $env:GITHUB_ENV
          } else {
            "Two private Worker contract tests are skipped; set VOXGO_API_CONTRACTS and VOXGO_API_READ_TOKEN for default-branch acceptance." >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Run regression tests with branch coverage
        shell: pwsh
        run: |
          python -m coverage run -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath test-results.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Report and enforce coverage
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path .coverage)) { throw "No coverage data was produced" }
          python -m coverage json -o coverage.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m coverage report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: |
            test-results.log
            coverage.json
          retention-days: 14
